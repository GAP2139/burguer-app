name: Test Microservices

on:
    push:
        branches: 
          - aula-01
    pull_request:
        branches: [aula-01]

jobs:
    test-auth-service:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.12.4'

            - name: Install dependencies
              working-directory: /media/gap/Novo volume/alura-python-testes/burger-app/auth-service
              run: |
                pip install -r requirements.txt

            - name: Run tests
              working-directory: /media/gap/Novo volume/alura-python-testes/burger-app/auth-service
              run: |
                pytest -v --cov=models --cov=services --cov=config --cov=controllers
                radon cc ./models/auth_model.py
